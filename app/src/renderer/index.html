<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self'" />
  <link rel="stylesheet" href="styles/global.css" />
  <link rel="stylesheet" href="styles/hud.css" />
  <title>DictaThesis</title>
</head>
<body>
  <div class="hud">
    <div class="titlebar">
      <div class="titlebar-brand">
        <img src="assets/turgot-avatar.png" class="titlebar-avatar" width="28" height="28" alt="" />
        <span class="titlebar-label">DictaThesis</span>
        <span id="status-dot" class="status-dot idle" aria-hidden="true"></span>
        <span id="status-bar" class="titlebar-status">Ready · F9</span>
      </div>
      <div class="titlebar-buttons">
        <button id="btn-start" class="btn btn-sm btn-start" title="Start dictation (F9)">Start</button>
        <button id="btn-stop" class="btn btn-sm btn-stop" disabled title="Stop dictation">Stop</button>
        <button id="btn-pin" class="btn btn-sm btn-icon pinned" title="Always on top (pinned)">&#128204;</button>
        <button id="btn-settings" class="btn btn-sm btn-icon" title="Settings">&#9881;</button>
        <button id="btn-quit" class="btn btn-sm btn-icon" title="Quit">&times;</button>
      </div>
    </div>

    <div class="toolbar-row">
      <button id="btn-insert" class="btn btn-sm btn-toggle active" title="Paste into focused app">Insert</button>
      <div class="insert-menu" id="insert-menu">
        <button id="btn-insert-menu" class="btn btn-sm btn-secondary" type="button" aria-haspopup="true" aria-expanded="false">
          Symbols &#9662;
        </button>
        <div id="insert-menu-panel" class="insert-menu-panel" hidden>
          <button type="button" class="insert-menu-item" data-insert="(">(</button>
          <button type="button" class="insert-menu-item" data-insert=")">)</button>
          <button type="button" class="insert-menu-item" data-insert="«">«</button>
          <button type="button" class="insert-menu-item" data-insert="»">»</button>
          <button type="button" class="insert-menu-item" data-insert="[">[</button>
          <button type="button" class="insert-menu-item" data-insert="]">]</button>
        </div>
      </div>
      <button id="btn-clear" class="btn btn-sm btn-secondary" title="Clear transcript and session context">Clear</button>
      <div class="copy-menu" id="copy-menu">
        <button id="btn-copy-menu" class="btn btn-sm btn-secondary" type="button" aria-haspopup="true" aria-expanded="false">
          Copy &#9662;
        </button>
        <div id="copy-menu-panel" class="copy-menu-panel" hidden>
          <button type="button" class="copy-menu-item" data-copy="selected">Copy selected</button>
          <button type="button" class="copy-menu-item" data-copy="all">Copy all</button>
          <button type="button" class="copy-menu-item" data-copy="unselect">Unselect all</button>
        </div>
      </div>
    </div>

    <div id="chunks" class="chunks">
      <div class="empty-state">Transcribed text appears here</div>
    </div>
  </div>

  <script src="app/hud.js"></script>
</body>
</html>
